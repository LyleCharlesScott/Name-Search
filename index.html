<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Name Trend Visualizer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">US Baby Name Explorer</h1>
            <p class="text-slate-500">Type a name to search historical census trends and relative popularity rank over time.</p>
            <div id="loadingStatus" class="mt-4 text-sm font-medium text-amber-600 animate-pulse">Loading name database into memory...</div>
        </header>

        <!-- Search Section -->
        <div class="relative max-w-md mx-auto mb-12">
            <label for="nameSearch" class="block text-sm font-semibold text-slate-700 mb-2">Search Name</label>
            <input 
                type="text" 
                id="nameSearch" 
                placeholder="Start typing a name... (e.g., Mary, John)" 
                disabled
                class="w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none disabled:bg-slate-100 disabled:cursor-not-allowed transition"
            >
            <!-- Dropdown Autocomplete Menu -->
            <ul 
                id="autocompleteList" 
                class="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden z-50 divide-y divide-slate-100"
            ></ul>
        </div>

        <!-- Dashboard Content -->
        <div id="dashboard" class="hidden">
            <h2 id="selectedNameTitle" class="text-3xl font-bold text-center text-slate-900 mb-8 capitalize"></h2>
            
            <!-- Charts Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Count Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-lg font-bold text-slate-700 mb-4 text-center">Total Registered Births</h3>
                    <div class="relative h-80">
                        <canvas id="countChart"></canvas>
                    </div>
                </div>

                <!-- Rank Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-lg font-bold text-slate-700 mb-4 text-center">Popularity Rank (Inverted)</h3>
                    <div class="relative h-80">
                        <canvas id="rankChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Core Application State ---
        let nameTrie = null;
        let countChartInstance = null;
        let rankChartInstance = null;

        // --- DOM Elements ---
        const searchInput = document.getElementById('nameSearch');
        const autocompleteList = document.getElementById('autocompleteList');
        const loadingStatus = document.getElementById('loadingStatus');
        const dashboard = document.getElementById('dashboard');
        const selectedNameTitle = document.getElementById('selectedNameTitle');

        // --- Initialize Application & Fetch Data ---
        // Replace 'combined_names_trie.json' with your exact file name if different
        fetch('names_trie.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not find the JSON data file.");
                return response.json();
            })
            .then(data => {
                nameTrie = data;
                loadingStatus.classList.add('hidden');
                searchInput.disabled = false;
                searchInput.placeholder = "Start typing a name...";
                searchInput.focus();
            })
            .catch(error => {
                console.error(error);
                loadingStatus.textContent = "Error loading database. Make sure your JSON file is in the same directory.";
                loadingStatus.classList.remove('text-amber-600', 'animate-pulse');
                loadingStatus.classList.add('text-red-600');
            });

        // --- Event Listeners ---
        searchInput.addEventListener('input', handleTyping);
        
        // Hide autocomplete when clicking outside the input or list
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== autocompleteList) {
                autocompleteList.classList.add('hidden');
            }
        });

        // --- Core Functions ---

        /**
         * Fires whenever the user types in the search bar.
         */
        function handleTyping() {
            const query = searchInput.value.trim().toUpperCase();
            if (!query) {
                autocompleteList.classList.add('hidden');
                return;
            }

            // Step 1: Traverse the Trie down to the node of the current typed prefix
            let currentNode = nameTrie;
            for (let i = 0; i < query.length; i++) {
                const char = query[i];
                if (currentNode[char]) {
                    currentNode = currentNode[char];
                } else {
                    // Prefix doesn't exist in our Trie
                    renderAutocomplete([]);
                    return;
                }
            }

            // Step 2: From that prefix node, find all complete names underneath it
            const matchedNames = [];
            findAllNamesFromNode(currentNode, query, matchedNames);

            // Sort matches alphabetically and limit to 10 suggestions
            matchedNames.sort();
            renderAutocomplete(matchedNames.slice(0, 10));
        }

        /**
         * Recursively searches down a Trie node to extract all downstream complete names.
         */
        function findAllNamesFromNode(node, currentPrefix, results) {
            // If this node represents a completed name, reconstruct it
            if (node.$isName) {
                // Convert back from ALL CAPS to Title Case for nice presentation
                const prettyName = currentPrefix.charAt(0) + currentPrefix.slice(1).toLowerCase();
                results.push({ name: prettyName, node: node });
            }

            // Loop through all keys that are single capital letters (ignoring metadata like $isName)
            for (const key in node) {
                if (key.length === 1 && key >= 'A' && key <= 'Z') {
                    findAllNamesFromNode(node[key], currentPrefix + key, results);
                }
            }
        }

        /**
         * Renders the matching autocomplete list to the UI.
         */
        function renderAutocomplete(matches) {
            if (matches.length === 0) {
                autocompleteList.classList.add('hidden');
                return;
            }

            autocompleteList.innerHTML = '';
            matches.forEach(match => {
                const li = document.createElement('li');
                li.className = "px-4 py-3 hover:bg-indigo-50 cursor-pointer font-medium text-slate-700 transition";
                li.textContent = match.name;
                
                // Clicking a match loads the graphs
                li.addEventListener('click', () => {
                    searchInput.value = match.name;
                    autocompleteList.classList.add('hidden');
                    displayData(match.name, match.node);
                });
                autocompleteList.appendChild(li);
            });

            autocompleteList.classList.remove('hidden');
        }

        /**
         * Extracts data from the name node and builds/updates Chart.js instances
         */
        function displayData(name, nameNode) {
            dashboard.classList.remove('hidden');
            selectedNameTitle.textContent = name;

            // Combine or read both male/female records if they exist under this single name node
            const genders = Object.keys(nameNode.$stats); // Will contain ['M'], ['F'], or both ['M', 'F']
            
            // For simplicity, we grab the first available gender list, or mix them. 
            // In a production app, you might want to show separate lines for M/F. 
            // Here, we grab the dominant gender track for clean display.
            const preferredGender = genders.includes('F') && (!genders.includes('M') || nameNode.$stats['F'].length >= nameNode.$stats['M'].length) ? 'F' : 'M';
            const rawDataPoints = nameNode.$stats[preferredGender];

            // Map data to structure ready for Chart.js
            const labels = rawDataPoints.map(point => point[0]); // Years
            const counts = rawDataPoints.map(point => point[1]); // Counts
            const ranks = rawDataPoints.map(point => point[2]);   // Ranks

            const genderLabel = preferredGender === 'F' ? 'Female' : 'Male';

            // --- Chart 1: Counts ---
            if (countChartInstance) countChartInstance.destroy();
            const ctxCount = document.getElementById('countChart').getContext('2d');
            countChartInstance = new Chart(ctxCount, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${name} (${genderLabel} Births)`,
                        data: counts,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.1,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } }
                }
            });

            // --- Chart 2: Ranks ---
            if (rankChartInstance) rankChartInstance.destroy();
            const ctxRank = document.getElementById('rankChart').getContext('2d');
            rankChartInstance = new Chart(ctxRank, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Popularity Rank`,
                        data: ranks,
                        borderColor: '#06b6d4',
                        backgroundColor: 'transparent',
                        tension: 0.1,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            reverse: true, // Crucial part: rank 1 at the top, rank 1000 at bottom
                            title: { display: true, text: 'Rank (Lower number = More popular)' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
